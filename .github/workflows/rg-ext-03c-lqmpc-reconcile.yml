name: RG-EXT-03C LQMPC Native Semantics Reconciliation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact selected runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib
          python -m pip install 'git+https://github.com/osqp/osqp-python.git@dcc6384845e27b275fc41b2106dd2c379d5d5db4'
          python -m pip install --no-deps 'git+https://github.com/CLOCTools/lqmpc.git@0895de48013fc9a676053a6a46fc0b0fd34f8987'
          python -m pip freeze > RG_EXT_03C_PIP_FREEZE.txt
      - name: Run frozen reconciliation certificate
        id: reconcile
        continue-on-error: true
        run: python rg_ext03c/lqmpc_reconcile.py
      - name: Hash evidence
        if: always()
        run: |
          sha256sum rg_ext03c/lqmpc_reconcile.py > RG_EXT_03C_EXECUTION_SHA256.txt
          sha256sum RG_EXT_03C_PIP_FREEZE.txt >> RG_EXT_03C_EXECUTION_SHA256.txt
          if [ -f RG_EXT_03C_RECONCILIATION_RECEIPT.json ]; then sha256sum RG_EXT_03C_RECONCILIATION_RECEIPT.json >> RG_EXT_03C_EXECUTION_SHA256.txt; fi
      - name: Upload reconciliation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rg-ext-03c-lqmpc-reconciliation
          path: |
            RG_EXT_03C_RECONCILIATION_RECEIPT.json
            RG_EXT_03C_PIP_FREEZE.txt
            RG_EXT_03C_EXECUTION_SHA256.txt
          if-no-files-found: warn
      - name: Enforce terminal state after evidence preservation
        if: always()
        run: |
          test -f RG_EXT_03C_RECONCILIATION_RECEIPT.json || exit 2
          python - <<'PY'
          import json
          r=json.load(open('RG_EXT_03C_RECONCILIATION_RECEIPT.json'))
          ok=r['terminal_state']=='SELECTED_LQMPC_NATIVE_SEMANTICS_RECONCILED_STOP_BEFORE_CONDITION_1_AUTHORIZATION'
          raise SystemExit(0 if ok else 1)
          PY
