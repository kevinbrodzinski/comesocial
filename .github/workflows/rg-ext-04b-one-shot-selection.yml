name: RG-EXT-04B One-Shot Selection
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute frozen selector exactly once
        run: python rg_ext04b/select_once.py | tee rg_ext04b/selection.log
      - name: Freeze execution artifact
        uses: actions/upload-artifact@v4
        with:
          name: rg-ext-04b-selection
          path: |
            rg_ext04b/out/
            rg_ext04b/selection.log
          if-no-files-found: error
