name: RG-EXT-04A G9 Three Candidates
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy scipy
      - run: python rg_ext04a/g9_source_only.py quad
      - uses: actions/upload-artifact@v4
        with: {name: rg-ext-04a-g9-quad, path: RG_EXT_04A_G9_CAND-E04-001.json}
  portfolio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy scipy
      - run: python rg_ext04a/g9_source_only.py portfolio
      - uses: actions/upload-artifact@v4
        with: {name: rg-ext-04a-g9-portfolio, path: RG_EXT_04A_G9_CAND-E04-002.json}
  pandapower:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/e2nIEE/pandapower.git@e0bcb3bee7954c7845c735834bdb42419fc95b8a'
      - run: python rg_ext04a/g9_source_only.py pandapower
      - uses: actions/upload-artifact@v4
        with: {name: rg-ext-04a-g9-pandapower, path: RG_EXT_04A_G9_CAND-E04-003.json}
